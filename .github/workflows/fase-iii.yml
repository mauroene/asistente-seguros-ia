name: VidaSegura ES V3 - Fase III

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fase-iii/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validacion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.18'
      - name: Instalar dependencias fijadas
        run: python -m pip install -r FaseIII/requirements.txt
      - name: Ejecutar pruebas y despliegue HTTP temporal
        shell: bash
        run: |
          python FaseIII/pipeline.py --evidencia "$RUNNER_TEMP/vidasegura/resultado.json" 2>&1 | tee "$RUNNER_TEMP/vidasegura.log"
      - name: Conservar evidencia de ejecución
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vidasegura-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vidasegura/resultado.json
            ${{ runner.temp }}/vidasegura.log
          if-no-files-found: warn
